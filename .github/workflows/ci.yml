name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plc
          POSTGRES_PASSWORD: plc
          POSTGRES_DB: plc_pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # e2e tests run against the CI database itself (it starts empty).
      DATABASE_URL: postgresql://plc:plc@localhost:5432/plc_pos?schema=public
      TEST_DATABASE_URL: postgresql://plc:plc@localhost:5432/plc_pos?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Schema matches migrations
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
