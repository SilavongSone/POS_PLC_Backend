services:
  postgres:
    image: postgres:17-alpine
    container_name: plc-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc_dev_password
      POSTGRES_DB: plc_pos
      TZ: Asia/Vientiane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
