services:
  postgres:
    image: postgres:17-alpine
    container_name: plc-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc_dev_password
      POSTGRES_DB: plc_pos
      TZ: Asia/Vientiane
    ports:
      # Host port 5433 so it does not clash with a native PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
